# Builds the Windows EXE on GitHub, so nobody needs Python on their own PC.
# Download: GitHub -> Actions -> "Build Setu EXE" -> latest run -> Artifacts -> Setu-POS-Setup.
name: Build Setu EXE

on:
  push:
    paths:
      - 'app_main.py'
      - 'hotel_erp.html'
      - 'sw.js'
      - 'manifest.json'
      - '*.png'
      - 'favicon.ico'
      - '*.bat'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller pywebview

      # Same flags as Build-New-EXE.bat; keep both in sync
      - name: Build EXE
        shell: cmd
        run: python -m PyInstaller --noconfirm --onefile --windowed --icon "favicon.ico" --name "Aghanya-Devanya-Hotel-ERP" --add-data "hotel_erp.html;." --add-data "manifest.json;." --add-data "sw.js;." --add-data "icon-192.png;." --add-data "icon-512.png;." --add-data "logo.png;." --add-data "favicon.ico;." app_main.py

      # Only what a client PC needs: never keygen.py, keys or the cloud code
      - name: Pack setup folder
        shell: cmd
        run: |
          mkdir Setu-POS-Setup
          copy dist\Aghanya-Devanya-Hotel-ERP.exe Setu-POS-Setup\
          for %%f in (Install-Aghanya-Devanya-ERP-Setup.bat hotel_erp.html manifest.json sw.js icon-192.png icon-512.png logo.png favicon.ico) do copy %%f Setu-POS-Setup\

      - uses: actions/upload-artifact@v4
        with:
          name: Setu-POS-Setup
          path: Setu-POS-Setup
          retention-days: 90

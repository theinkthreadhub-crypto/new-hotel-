name: Setu Cloud check

# Read-only: is the Cloudflare login set, and what is live on setu-cloud? Deploys nothing.
on:
  push:
    paths: ['.github/workflows/setu-cloud-check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare secrets present?
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "CLOUDFLARE_API_TOKEN set: $([ -n "$TOKEN" ] && echo yes || echo NO)"
          echo "CLOUDFLARE_ACCOUNT_ID set: $([ -n "$ACC" ] && echo yes || echo NO)"
      - name: Cloudflare login and setu-cloud deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no token, skipping"; exit 0; fi
          npx --yes wrangler@4 whoami || true
          npx --yes wrangler@4 deployments list --name setu-cloud || echo "setu-cloud is not deployed on this account"
      - name: What answers on the internet
        run: |
          echo "setu-cloud /api/ping:"; curl -s -m 15 https://setu-cloud.theinkthreadhub.workers.dev/api/ping || echo "(no answer)"; echo
          echo "setu-cloud /api/counter/link (400 install id = new code; hotel code required = old code):"
          curl -s -m 15 -X POST -H 'Content-Type: application/json' -d '{}' https://setu-cloud.theinkthreadhub.workers.dev/api/counter/link || echo "(no answer)"; echo
          echo "setu-cloud /admin.html:"; curl -s -m 15 -o /dev/null -w "%{http_code}\n" https://setu-cloud.theinkthreadhub.workers.dev/admin.html || true
          echo "library setu-erp /api ping:"; curl -s -m 15 -o /dev/null -w "%{http_code}\n" https://setu-erp.theinkthreadhub.workers.dev/view || true

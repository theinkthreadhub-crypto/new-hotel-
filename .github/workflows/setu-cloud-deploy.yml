name: Setu Cloud deploy

# Puts cloud/ (Setu Cloud Worker) live on Cloudflare, like Library ERP's worker deploy.
# Runs on push to main / hotel-software, or by hand: Actions -> "Setu Cloud deploy" -> Run workflow.
# Needs repo secrets (Settings -> Secrets and variables -> Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Worker secrets (ADMIN_KEY, LICENSE_PRIVATE_KEY, Razorpay) stay in Cloudflare and are not touched here.
on:
  push:
    branches: [main, hotel-software]
    paths: ['cloud/**', 'hotel_erp.html', 'sw.js', 'manifest.json', '.github/workflows/setu-cloud-deploy.yml']
  workflow_dispatch:

concurrency:
  group: setu-cloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set, so Setu Cloud was not deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci --no-audit --no-fund
      - name: Copy app files and check syntax
        run: node scripts/copy-assets.mjs && node --check src/worker.js
      - name: Deploy to Cloudflare
        if: steps.secrets.outputs.ok == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

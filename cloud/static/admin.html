<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Setu Pro Super Admin</title>
<link rel="manifest" href="admin.webmanifest">
<meta name="theme-color" content="#0ea5e9">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{ --bg:#eef1f6; --card:#fff; --ink:#1d2433; --muted:#6b7385; --line:#e3e7ef; --pri:#2b4c7e; --pri-ink:#fff; --brand:#1f3a63; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; --soft:#f8fafc; }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif }
  header{ padding:12px 16px; padding-top:max(12px, env(safe-area-inset-top)); display:flex; gap:10px; align-items:center; background:var(--brand); color:#fff; position:sticky; top:0; z-index:5 }
  header h1{ flex:1; color:#fff } header button{ background:#ffffff26 !important; color:#fff !important; border:0 !important; padding:8px 10px; font-size:13px }
  h1{ font-size:17px; margin:0 } h2{ font-size:16px; margin:0 0 10px } h3{ font-size:14px; margin:16px 0 8px }
  nav{ display:flex; position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); z-index:6; padding-bottom:env(safe-area-inset-bottom) }
  nav button{ flex:1; background:transparent; color:var(--muted); border:0; border-radius:0; padding:12px 2px; font-size:12px; font-weight:600 }
  nav button.on{ color:var(--pri); box-shadow:inset 0 3px 0 var(--pri) }
  main{ padding:12px; max-width:980px; margin:0 auto 80px }
  input, button, select, textarea{ font:inherit; padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink) }
  button{ cursor:pointer; background:var(--pri); color:var(--pri-ink); border:0; font-weight:600 }
  button.g{ background:transparent; color:var(--ink); border:1px solid var(--line) }
  button.bad{ background:var(--bad); color:#fff }
  button:disabled{ opacity:.5; cursor:default }
  label{ display:block; font-size:12px; color:var(--muted); margin-bottom:3px }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px }
  .grid > div > input, .grid > div > select{ width:100% }
  .stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-bottom:14px }
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px }
  .stat b{ display:block; font-size:22px }
  .wrap{ overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:12px }
  table{ width:100%; border-collapse:collapse }
  .wrap table{ min-width:860px }
  th, td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle }
  th{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em }
  tr.click{ cursor:pointer } tr.click:hover td{ background:var(--soft) }
  .pill{ padding:2px 8px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap }
  .p-active{ background:#dcfce7; color:#166534 } .p-trial{ background:#e0f2fe; color:#075985 }
  .p-expired{ background:#fee2e2; color:#991b1b } .p-suspended{ background:#e2e8f0; color:#334155 } .p-pending{ background:#fef3c7; color:#92400e }
  .h-ok{ background:#dcfce7; color:#166534 } .h-warn{ background:#fef3c7; color:#92400e } .h-bad{ background:#fee2e2; color:#991b1b }
  .muted{ color:var(--muted) } .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin:12px 0; overflow-x:auto }
  .tabs button{ background:transparent; color:var(--muted); border-radius:8px 8px 0 0; white-space:nowrap }
  .tabs button.on{ color:var(--ink); background:var(--soft); border:1px solid var(--line); border-bottom-color:var(--soft) }
  .feat{ display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--soft) }
  .feat select{ margin-left:auto }
  .two{ display:grid; grid-template-columns:1fr 300px; gap:16px } @media (max-width:820px){ .two{ grid-template-columns:1fr } }
  .rcpt{ background:#fff; color:#000; font:12px/1.35 ui-monospace, Consolas, monospace; padding:10px; border:1px dashed #94a3b8; margin:0 auto }
  .rcpt .c{ text-align:center } .rcpt hr{ border:0; border-top:1px dashed #000 } .rcpt .r{ text-align:right } .rcpt td{ padding:1px 0; border:0 }
  #drawer{ position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; z-index:10; overflow:auto; padding:20px 12px }
  #drawer .panel{ max-width:980px; margin:0 auto; background:var(--card); border-radius:14px; padding:18px; border:1px solid var(--line) }
  #login{ max-width:380px; margin:9vh auto 0; padding:0 16px }
  #login input{ width:100%; margin:10px 0 }
  .err{ color:var(--bad); font-weight:600 } .ok{ color:var(--ok); font-weight:600 }
  code{ font:12px ui-monospace, Consolas, monospace; background:var(--soft); padding:1px 5px; border-radius:5px; word-break:break-all }
  /* Library ERP style hotel cards */
  .kpis{ display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; margin-bottom:12px } @media (max-width:700px){ .kpis{ grid-template-columns:repeat(2, 1fr) } }
  .k{ background:var(--card); border:2px solid var(--line); border-radius:12px; padding:10px; text-align:center; cursor:pointer } .k.on{ border-color:var(--pri) }
  .k b{ display:block; font-size:22px } .k span{ font-size:11px; color:var(--muted) }
  .hcard{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px }
  .hcard .top{ display:flex; gap:8px; align-items:flex-start } .hcard .top .nm{ flex:1; min-width:0 }
  .info{ display:grid; grid-template-columns:1fr 1fr; gap:2px 14px; margin:8px 0; font-size:13px } @media (max-width:560px){ .info{ grid-template-columns:1fr } }
  .info div{ display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid var(--line); padding:4px 0 } .info span{ color:var(--muted) } .info b{ text-align:right }
  .alert{ border-radius:10px; padding:7px 10px; font-size:13px; font-weight:600; margin:6px 0 } .alert.warn{ background:#fef3c7; color:#92400e } .alert.bad{ background:#fee2e2; color:#991b1b }
  .acts{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px } .acts a, .acts button{ padding:6px 10px; font-size:13px; border-radius:8px; text-decoration:none }
  a.btnl{ background:transparent; color:var(--ink); border:1px solid var(--line); font-weight:600 } a.btnl.wa{ background:#16a34a; color:#fff; border-color:#16a34a }
  .badge{ background:var(--bad); color:#fff; border-radius:20px; font-size:11px; padding:1px 7px; margin-left:4px }
  #sheet{ position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; z-index:15; align-items:flex-end; justify-content:center }
  #sheet.open{ display:flex } #sheet .box{ background:var(--card); width:100%; max-width:560px; border-radius:16px 16px 0 0; max-height:90vh; overflow:auto; padding:16px }
  #sheet textarea, #sheet input, #sheet select{ width:100% }
  .msg{ max-width:85%; padding:8px 11px; border-radius:12px; margin:6px 0; white-space:pre-wrap } .msg.hotel{ background:var(--soft); border:1px solid var(--line) } .msg.admin{ background:#dcfce7; color:#14532d; margin-left:auto }
  .msg small{ display:block; color:var(--muted); font-size:11px }
  #toast{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; padding:9px 16px; border-radius:10px; display:none; z-index:20 }
</style>
</head>
<body>
<div id="login">
  <div style="text-align:center"><img src="icon-192.png" alt="" style="width:64px;height:64px;border-radius:14px"><h2 style="margin:10px 0 2px">Setu Hotel — Super Admin</h2>
    <p class="muted" style="margin:0 0 12px">Monitor all hotels, payments and support</p></div>
  <div class="card"><form id="lf"><label>Admin Key</label><input id="key" type="password" placeholder="Cloudflare ADMIN_KEY" autocomplete="off" required>
    <label style="display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:13px"><input id="remember" type="checkbox" style="width:auto;margin:0" checked> Remember on this device (only your own phone)</label>
    <button style="width:100%;padding:11px">Open dashboard</button></form>
  <p id="lerr" class="err"></p></div>
  <p class="muted" style="text-align:center;font-size:12px">Aghanya Devanya Enterprises</p>
</div>

<div id="app" hidden>
  <header>
    <h1>Super Admin</h1>
    <button onclick="show(VIEW)" title="Refresh">↻</button>
    <button onclick="logout()">Exit</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="drawer"><div class="panel" id="panel"></div></div>
<div id="toast"></div>
<div id="sheet"><div class="box" id="sbox"></div></div>

<script>
let KEY = '', META = null, HOTELS = [], VIEW = 'hotels', CUR = null, TAB = 'overview';
// Remembered only on a device the vendor ticked (e.g. the Setu Admin phone app)
try{ KEY = sessionStorage.getItem('setu_admin') || localStorage.getItem('setu_admin') || ''; }catch(e){}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d8 = ms => ms ? new Date(ms).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : '-';
const dt = ms => ms ? new Date(ms).toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '-';
const rs = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');
const state = h => h.status === 'suspended' ? 'suspended' : ((h.paid_until ?? h.paidUntil) < Date.now() && !h.lifetime ? 'expired' : h.status);
const pill = s => `<span class="pill p-${esc(s)}">${esc(s)}</span>`;
const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); return m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; };
// Backup health = when the hotel's data last reached the cloud
const health = ms => !ms ? '<span class="pill h-bad">No backup yet</span>'
  : Date.now() - ms < 26 * 36e5 ? `<span class="pill h-ok">OK · ${ago(ms)}</span>`
  : Date.now() - ms < 72 * 36e5 ? `<span class="pill h-warn">${ago(ms)}</span>`
  : `<span class="pill h-bad">${ago(ms)}</span>`;
const backupIssue = h => state(h) !== 'suspended' && (!h.seen || Date.now() - h.seen > 48 * 36e5);
function toast(t){ const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2600); }

async function api(path, body){
  const r = await fetch(path, {method: 'POST', headers: {'X-Setu-Admin': KEY, 'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  if(r.status === 401) throw new Error('Invalid Admin Key');
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
const run = fn => async (...a) => { try{ await fn(...a); }catch(e){ alert(e.message); } };

// ---------------- navigation ----------------
const VIEWS = {hotels: 'Hotels', tickets: 'Tickets', dash: 'Dashboard', add: '+ New', audit: 'Log', blocked: 'Blocked'};
let UNREAD = 0;
function nav(){
  $('#nav').innerHTML = Object.entries(VIEWS).map(([k, v]) => `<button class="${VIEW === k ? 'on' : ''}" onclick="show('${k}')">${v}${k === 'tickets' && UNREAD ? `<span class="badge">${UNREAD}</span>` : ''}</button>`).join('');
}
const show = run(async v => { VIEW = v; nav(); await ({dash: drawDash, hotels: drawHotels, tickets: drawTickets, add: drawAdd, audit: drawAudit, blocked: drawBlocked})[v](); nav(); });

async function loadHotels(){ const j = await api('/api/admin/hotels'); HOTELS = j.hotels; UNREAD = j.ticketsUnread || 0; }

// ---------------- dashboard ----------------
async function drawDash(){
  await loadHotels();
  const st = await api('/api/admin/stats');
  const c = s => HOTELS.filter(h => state(h) === s).length;
  // Monthly recurring estimate from each paying hotel's monthly price for its tier
  const monthly = t => { const p = Object.values(META.plans).find(x => x.tier === t && x.days <= 31); return p ? p.price : 0; };
  const mrr = HOTELS.filter(h => state(h) === 'active').reduce((a, h) => a + monthly(h.tier), 0);
  const month = Date.now() - 30 * 864e5;
  const soon = HOTELS.filter(h => ['active', 'trial'].includes(state(h)) && h.paid_until - Date.now() < 7 * 864e5).sort((a, b) => a.paid_until - b.paid_until);
  $('#main').innerHTML = `
    <div class="stats">${[['Total Hotels', HOTELS.length], ['Paid', c('active')], ['Trial', c('trial')], ['Expired', c('expired')], ['Suspended', c('suspended')],
      ['New (30 days)', HOTELS.filter(h => h.created > month).length], ['Payments (30 days)', rs(st.paid30.s / 100)], ['MRR (estimate)', rs(mrr)]]
      .map(([k, v]) => `<div class="stat"><span class="muted">${k}</span><b>${v}</b></div>`).join('')}</div>
    <div class="two">
      <div class="card"><h2>Expiring within 7 days</h2>
        <table><tr><th>Hotel</th><th>Status</th><th>Valid until</th><th>Mobile</th></tr>
        ${soon.map(h => `<tr class="click" onclick="openHotel('${esc(h.code)}')"><td><b>${esc(h.name)}</b> <span class="muted">${esc(h.code)}</span></td><td>${pill(state(h))}</td><td>${d8(h.paid_until)}</td><td>${esc(h.phone)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">None</td></tr>'}</table>
      </div>
      <div class="card"><h2>Backup issues</h2><p class="muted" style="margin-top:-6px">No data from the counter PC for 2+ days</p>
        <table>${HOTELS.filter(backupIssue).map(h => `<tr class="click" onclick="openHotel('${esc(h.code)}')"><td><b>${esc(h.name)}</b> <span class="muted">${esc(h.code)}</span></td><td>${health(h.seen)}</td><td>${esc(h.phone)}</td></tr>`).join('') || '<tr><td class="ok">All hotels are backing up</td></tr>'}</table>
      </div>
      <div class="card"><h2>Recent payments</h2>
        <table>${st.recent.map(p => `<tr><td>${esc(p.name || p.code)}<div class="muted">${esc(p.plan)} · ${dt(p.at)}</div></td><td class="r">${p.amount ? rs(p.amount / 100) : '<span class="muted">manual</span>'}</td></tr>`).join('') || '<tr><td class="muted">None yet</td></tr>'}</table>
      </div>
    </div>`;
}

// ---------------- hotels list (Library ERP style cards) ----------------
const DAYMS = 864e5;
// Counter licence from the hotel's data: 'lifetime' or a date (ISO)
const licDays = h => h.lic === 'lifetime' ? Infinity : h.lic ? Math.ceil((Date.parse(h.lic) - Date.now()) / DAYMS) : null;
const payDays = h => h.paid_until ? Math.ceil((h.paid_until - Date.now()) / DAYMS) : null;
const staleH = h => h.seen ? (Date.now() - h.seen) / 36e5 : 1e9;
const telHref = p => 'tel:' + String(p || '').replace(/[^\d+]/g, '');
const waHref = (p, name) => { let d = String(p || '').replace(/\D/g, ''); if(d.length === 10) d = '91' + d;
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent('Namaste ' + (name || '') + ' ji, Aghanya Devanya Enterprises (Setu POS) se baat ho rahi hai.'); };
// Hotels that need you come first: licence / payment running out, no backup, open tickets
function urgency(h){
  const d = licDays(h), p = payDays(h);
  let u = 0;
  if(d !== null && d !== Infinity){ if(d < 0) u = 200; else if(d <= 5) u = 150 - d; }
  if(p !== null && state(h) !== 'suspended'){ if(p < 0) u = Math.max(u, 120); else if(p <= 5) u = Math.max(u, 100 - p); }
  if(h.tickets) u = Math.max(u, 90);
  if(staleH(h) > 48 && h.seen) u = Math.max(u, 50);
  return u;
}
let KF = 'all';
const KFS = {all: 'All hotels', stale: 'Backup stale (48h+)', lic: 'Licence ≤5 days / expired', pay: 'Cloud payment due ≤5 days', tk: 'Unread tickets'};
function kfMatch(h){
  if(KF === 'stale') return staleH(h) > 48;
  if(KF === 'lic'){ const d = licDays(h); return d !== null && d !== Infinity && d <= 5; }
  if(KF === 'pay'){ const p = payDays(h); return p !== null && p <= 5 && state(h) !== 'suspended'; }
  if(KF === 'tk') return h.tickets > 0;
  return true;
}
function setKF(k){ KF = KF === k && k !== 'all' ? 'all' : k; drawHotelsBody(); }
async function drawHotels(){
  await loadHotels();
  $('#main').innerHTML = `<div id="kpis"></div>
    <div class="row" style="margin-bottom:10px"><input id="q" placeholder="Search name / code / mobile / Install ID / domain" style="flex:1;min-width:220px"></div>
    <div id="fbar"></div><div id="cards"></div>`;
  $('#q').oninput = drawCards;
  drawHotelsBody();
}
function drawHotelsBody(){
  const n = k => HOTELS.filter(h => { const o = KF; KF = k; const m = kfMatch(h); KF = o; return m; }).length;
  $('#kpis').innerHTML = `<div class="kpis">${Object.entries({all: 'Hotels', stale: 'Backup stale', lic: 'Licence ≤5d', pay: 'Payment ≤5d', tk: 'Tickets'}).map(([k, l]) => {
    const c = n(k);
    return `<div class="k ${KF === k ? 'on' : ''}" onclick="setKF('${k}')"><b class="${k !== 'all' && c ? 'err' : k === 'all' ? '' : 'ok'}">${c}</b><span>${l}</span></div>`; }).join('')}</div>`;
  $('#fbar').innerHTML = KF !== 'all' ? `<div class="row" style="margin-bottom:8px"><b>Showing: ${KFS[KF]}</b><button class="g" onclick="setKF('all')">Show all</button></div>` : '';
  drawCards();
}
function drawCards(){
  const q = ($('#q').value || '').trim().toLowerCase();
  const list = HOTELS.filter(kfMatch).filter(h => !q || [h.name, h.code, h.phone, h.owner, h.iid || '', ...(h.domains || []).map(d => d.host)].join(' ').toLowerCase().includes(q))
    .sort((a, b) => urgency(b) - urgency(a) || b.created - a.created);
  $('#cards').innerHTML = list.map(h => {
    const d = licDays(h), p = payDays(h), sh = staleH(h), C = esc(h.code);
    let al = '';
    if(d !== null && d !== Infinity && d < 0) al += `<div class="alert bad">Counter licence expired on ${d8(Date.parse(h.lic))} — renew now</div>`;
    else if(d !== null && d !== Infinity && d <= 5) al += `<div class="alert warn">Counter licence ends on ${d8(Date.parse(h.lic))} — ${d} day${d === 1 ? '' : 's'} left</div>`;
    if(p !== null && state(h) !== 'suspended' && h.plan !== 'counter'){
      if(p < 0) al += `<div class="alert bad">Cloud payment overdue since ${d8(h.paid_until)}</div>`;
      else if(p <= 5) al += `<div class="alert warn">Cloud payment due on ${d8(h.paid_until)} — in ${p} day${p === 1 ? '' : 's'}</div>`;
    }
    if(h.tickets) al += `<div class="alert warn">${h.tickets} new ticket message${h.tickets === 1 ? '' : 's'} from the hotel</div>`;
    return `<div class="hcard"><div class="top"><div class="nm"><b style="font-size:15px">${esc(h.name)}</b> ${pill(state(h))}
        <div class="muted" style="font-size:12px"><code onclick="navigator.clipboard.writeText('${C}').then(() => toast('Copied ${C}'))" style="cursor:pointer">${C}</code> · ${esc(h.owner || '')} · ${esc(h.phone || '-')}</div></div></div>
      ${al}
      <div class="info">
        <div><span>Joined</span><b>${d8(h.created)}</b></div>
        <div><span>Type / Plan</span><b>${esc((META.templates[h.btype] || {}).label || '-')} · ${esc((META.tiers[h.tier] || {}).label || '-')}</b></div>
        <div><span>Counter licence</span><b class="${d === Infinity ? 'ok' : d === null ? '' : d < 0 ? 'err' : d <= 5 ? 'err' : 'ok'}">${d === Infinity ? 'Lifetime' : d === null ? '-' : d8(Date.parse(h.lic)) + ' · ' + d + 'd'}</b></div>
        <div><span>Cloud paid till</span><b>${h.plan === 'counter' ? 'follows licence' : p === null ? '-' : d8(h.paid_until) + (p < 0 ? ' · overdue' : ' · ' + p + 'd')}</b></div>
        <div><span>Backup</span><b>${health(h.seen)}</b></div>
        <div><span>Install ID</span><b><code>${esc(h.iid || '-')}</code></b></div>
      </div>
      <div class="row" style="gap:6px">${h.notice ? '<span class="pill p-pending">Message showing in app</span>' : ''}${+h.lockv === 2 ? '<span class="pill p-expired">App locked</span>' : +h.lockv === 1 ? '<span class="pill p-pending">Warning showing</span>' : ''}${(h.domains || []).map(x => `<span class="pill p-trial">${esc(x.host)}</span>`).join('')}</div>
      <div class="acts">
        ${h.phone ? `<a class="btnl" href="${telHref(h.phone)}">Call</a><a class="btnl wa" href="${waHref(h.phone, h.owner)}" target="_blank" rel="noopener">WhatsApp</a>` : ''}
        <button onclick="openHotel('${C}')">Open</button>
        <button class="g" onclick="noticeBox('${C}')">Message</button>
        <button class="${+h.lockv ? 'bad' : 'g'}" onclick="lockBox('${C}')">${+h.lockv === 2 ? 'Locked' : +h.lockv === 1 ? 'Warning' : 'Lock'}</button>
        <button class="g" onclick="hotelTickets('${C}')">Tickets${h.tickets ? `<span class="badge">${h.tickets}</span>` : ''}</button>
        <button class="g" onclick="dlBackup('${C}')">Backup</button>
        <button class="bad" onclick="delBox('${C}')">Delete</button>
      </div></div>`;
  }).join('') || `<p class="muted">${KF === 'all' ? 'No hotels yet' : 'Nothing in this filter ✔'}</p>`;
}

// ----- sheet dialogs -----
function sheet(html){ $('#sbox').innerHTML = html; $('#sheet').classList.add('open'); }
function closeSheet(){ $('#sheet').classList.remove('open'); }

const saveLock = run(async code => {
  const lv = +$('#lv').value;
  if(lv === 2 && !confirm('Lock Setu for this hotel? Billing on all their devices stops until you set it back to Normal.')) return;
  await adminUpdate(code, {lock: {lv, msg: $('#lm').value.trim()}}, ['Lock removed', 'Warning on', 'Setu locked'][lv]);
});
const dlBackup = run(async code => {
  const r = await fetch('/api/admin/backup', {method: 'POST', headers: {'X-Setu-Admin': KEY, 'Content-Type': 'application/json'}, body: JSON.stringify({code})});
  if(!r.ok) throw new Error('Backup download failed (HTTP ' + r.status + ')');
  const blob = await r.blob(), name = `setu-${code}-backup.json`;
  // Setu Hotel Admin phone app: hand the file to Android (save to Files / send on WhatsApp, Gmail, Drive)
  if(window.SA && SA.save){
    const u = new Uint8Array(await blob.arrayBuffer());
    let bin = '';
    for(let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    SA.save(name, 'application/json', btoa(bin));
    return toast('Backup ready — choose where to save / send');
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Backup downloaded');
});

let TICKETS = [];
async function drawTickets(code){
  TICKETS = (await api('/api/admin/tickets', {code: code || '', read: true})).tickets;
  await loadHotels();
  $('#main').innerHTML = `<div class="card"><h2>Help &amp; Support Tickets${code ? ' — ' + esc(hotelBy(code).name) : ''}</h2>
    ${code ? `<button class="g" onclick="show('tickets')">All hotels</button>` : '<p class="muted" style="margin-top:-6px">Hotels write from Setu → Help &amp; Support (1). Your reply shows there.</p>'}
    ${TICKETS.map(t => `<div class="hcard" style="cursor:pointer" onclick="ticketBox('${esc(t.id)}')"><b>${esc(t.subject)}</b> ${t.unread_admin ? '<span class="badge">new</span>' : ''} ${pill(t.status === 'resolved' ? 'active' : 'pending').replace(/>(active|pending)</, '>' + (t.status === 'resolved' ? 'resolved' : 'open') + '<')}
      <div class="muted" style="font-size:12px">${esc(t.hotel_name || hotelBy(t.code).name)} · <code>${esc(t.code)}</code> · ${dt(t.updated)}</div>
      <div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(((t.msgs || []).slice(-1)[0] || {}).text || '')}</div></div>`).join('') || '<p class="muted">No tickets yet.</p>'}</div>`;
}
const hotelTickets = run(async code => { VIEW = 'tickets'; nav(); await drawTickets(code); });
function ticketBox(id){
  const t = TICKETS.find(x => x.id === id);
  if(!t) return;
  sheet(`<h2>${esc(t.subject)}</h2><p class="muted">${esc(t.hotel_name || hotelBy(t.code).name)} · <code>${esc(t.code)}</code> · ${esc(t.status)}</p>
    <div>${(t.msgs || []).map(m => `<div class="msg ${m.by}">${esc(m.text)}<small>${m.by === 'admin' ? 'You' : 'Hotel'} · ${dt(m.at)}</small></div>`).join('')}</div>
    <label>Reply</label><textarea id="rp" rows="3" placeholder="Type your reply to the hotel"></textarea>
    <div class="row" style="margin-top:10px"><button onclick="sendReply('${esc(id)}', false)">Send reply</button><button class="g" onclick="sendReply('${esc(id)}', true)">Reply &amp; resolve</button>
      <button class="g" onclick="toggleTicket('${esc(id)}')">${t.status === 'resolved' ? 'Reopen' : 'Mark resolved'}</button><button class="g" onclick="closeSheet()">Close</button></div>`);
}
const sendReply = run(async (id, resolve) => {
  const t = TICKETS.find(x => x.id === id), reply = $('#rp').value.trim();
  if(!reply && !resolve) return toast('Write a reply');
  await api('/api/admin/ticket', {code: t.code, id, reply, status: resolve ? 'resolved' : undefined});
  toast('Sent'); closeSheet(); await drawTickets();
});
const toggleTicket = run(async id => {
  const t = TICKETS.find(x => x.id === id);
  await api('/api/admin/ticket', {code: t.code, id, status: t.status === 'resolved' ? 'open' : 'resolved'});
  toast('Updated'); closeSheet(); await drawTickets();
});

    <div class="row" style="margin-top:8px"><button class="g" onclick="addField()">+ Field</button><button onclick="saveBilling()">Billing Template Save</button></div>
    <p class="muted">Existing bills are not changed; the new template applies to new bills only.</p>
  </div><div><label>Preview</label><div id="b_prev"></div></div></div>`;
  FIELDS = (b.fields || []).map(f => ({...f}));
  drawFields();
  $('#tab').addEventListener('input', preview);
  $('#tab').addEventListener('change', preview);
}
let FIELDS = [];
function drawFields(){
  $('#b_fields').innerHTML = FIELDS.map((f, i) => `<div class="row" style="margin-bottom:6px">
    <input value="${esc(f.label)}" maxlength="30" placeholder="e.g. Vehicle No / Room No" oninput="FIELDS[${i}].label=this.value">
    <label style="margin:0"><input type="checkbox" ${f.required ? 'checked' : ''} onchange="FIELDS[${i}].required=this.checked"> Zaroori</label>
    <button class="g" onclick="FIELDS.splice(${i},1);drawFields()">Remove</button></div>`).join('') || '<p class="muted">No custom fields</p>';
  preview();
}
function addField(){ if(FIELDS.length < 6){ FIELDS.push({label: '', required: false}); drawFields(); } }
function billingForm(){
  return {paper: $('#b_paper').value, logoUrl: $('#b_logo').value.trim(), showLogo: $('#b_showLogo').checked, showTable: $('#b_table').checked,
    showCustomer: $('#b_cust').checked, headerNote: $('#b_head').value, footer: $('#b_foot').value, fields: FIELDS.filter(f => f.label.trim())};
}
function preview(){
  const b = billingForm(), w = {58: '200px', 80: '270px', A6: '300px'}[b.paper];
  const logo = b.showLogo && /^https:\/\//.test(b.logoUrl) ? `<div class="c"><img src="${esc(b.logoUrl)}" alt="" style="max-height:44px;max-width:70%"></div>` : '';
  $('#b_prev').innerHTML = `<div class="rcpt" style="width:${w}">${logo}<div class="c"><b>${esc(CUR.name)}</b></div><div class="c">Main Road, Shahar</div>
    ${b.headerNote ? `<div class="c">${esc(b.headerNote)}</div>` : ''}<hr><div class="c"><b>TAX INVOICE</b></div>
    <div>Bill No: #1024 &nbsp; 09/10/2026 8:15 PM</div>${b.showTable ? '<div>Table/Ref: <b>T-4</b></div>' : ''}${b.showCustomer ? '<div>Customer: Rahul</div>' : ''}
    ${b.fields.map(f => `<div>${esc(f.label)}: <b>……</b></div>`).join('')}<hr>
    <table style="width:100%"><tr><td>Paneer Tikka</td><td class="r">1</td><td class="r">240.00</td></tr><tr><td>Butter Naan</td><td class="r">4</td><td class="r">200.00</td></tr></table><hr>
    <table style="width:100%"><tr><td>Sub Total</td><td class="r">440.00</td></tr><tr><td>CGST @2.5%</td><td class="r">11.00</td></tr><tr><td>SGST @2.5%</td><td class="r">11.00</td></tr><tr><td><b>TOTAL</b></td><td class="r"><b>₹462.00</b></td></tr></table><hr>
    <div class="c">${esc(b.footer || 'Thank you! Visit again')}</div><div class="c" style="font-size:10px">Powered by Aghanya Devanya Enterprises</div></div>
    <p class="muted" style="font-size:11px">${b.paper === 'A6' ? 'A6 via print dialog' : b.paper + ' mm thermal'} · the logo does not print in thermal "Direct print" mode</p>`;
}
function saveBilling(){ update({billing: billingForm()}, 'Billing template saved — applies to new bills'); }

function tabRules(){
  const r = CUR.config.rules;
  $('#tab').innerHTML = `<div class="grid">
      <div><label>Cashier max discount % (above this needs Manager PIN)</label><input id="r_disc" type="number" min="0" max="100" value="${r.maxDiscPct ?? ''}" placeholder="blank = hotel setting"></div>
      <div><label>Customer mobile required for bills above ₹</label><input id="r_phone" type="number" min="0" value="${r.phoneAbove ?? ''}" placeholder="blank = off"></div>
    </div><div class="row" style="margin-top:12px"><button onclick="update({rules:{maxDiscPct:r_disc.value,phoneAbove:r_phone.value}}, 'Rules save')">Rules Save</button></div>
    <p class="muted">Rules apply to every device of the hotel; cashiers cannot change them in Settings.</p>`;
}

function tabDomains(){
  const h = CUR;
  $('#tab').innerHTML = `
    <table><tr><th>Domain</th><th>Type</th><th>Status</th><th></th></tr>
    ${(h.domains || []).map(d => `<tr><td><b>${esc(d.host)}</b>${d.status === 'active' ? ` <a href="https://${esc(d.host)}/hotel_erp.html" target="_blank" rel="noopener">open</a>` : ''}</td><td>${d.kind === 'sub' ? 'Subdomain' : 'Custom'}</td><td>${pill(d.status)}</td>
      <td class="row">${d.kind === 'custom' ? `<button class="g" onclick="checkDomain('${esc(d.host)}')">Check Status</button>` : ''}<button class="bad" onclick="removeDomain('${esc(d.host)}')">Remove</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">No domains — the hotel signs in with its Hotel Code</td></tr>'}</table>
    <div id="dns"></div>
    <h3>Subdomain ${META.baseDomain ? `(<code>xxx.${esc(META.baseDomain)}</code>)` : ''}</h3>
    ${META.baseDomain ? `<div class="row"><input id="d_slug" placeholder="royal" style="width:180px"><span>.${esc(META.baseDomain)}</span><button onclick="addDomain('sub', d_slug.value)">Add</button></div>`
      : '<p class="muted">Set BASE_DOMAIN (your Cloudflare domain) in wrangler.toml.</p>'}
    <h3>Hotel custom domain</h3>
    ${META.customDomains ? `<div class="row"><input id="d_host" placeholder="erp.hotelroyal.com" style="width:260px"><button onclick="addDomain('custom', d_host.value)">Add</button></div>
      <p class="muted">If the hotel already has a website, use a subdomain such as <code>erp.</code> — do not replace the main site.</p>`
      : '<p class="muted">Requires Cloudflare for SaaS: secrets CF_API_TOKEN + CF_ZONE_ID and var SAAS_CNAME_TARGET.</p>'}`;
}
function dnsTable(j){
  if(!j.records || !j.records.length) return '';
  return `<div class="card" style="background:var(--soft);margin-top:10px"><b>Add these DNS records at the hotel domain provider:</b>
    <table><tr><th>Type</th><th>Name</th><th>Value</th></tr>${j.records.map(r => `<tr><td>${esc(r.type)}</td><td><code>${esc(r.name)}</code></td><td><code>${esc(r.value)}</code></td></tr>`).join('')}</table>
    <p class="muted">The domain goes live once verification and HTTPS are ready (${esc(j.cf || 'pending')} / ssl ${esc(j.ssl || 'pending')}).</p></div>`;
}
const addDomain = run(async (kind, value) => {
  const j = await api('/api/admin/domain/add', {code: CUR.code, kind, value});
  CUR = await api('/api/admin/hotel', {code: CUR.code});
  tabDomains();
  $('#dns').innerHTML = dnsTable(j);
  toast(j.status === 'active' ? 'Domain live: ' + j.host : 'Add the DNS records, then check the status');
});
const checkDomain = run(async host => {
  const j = await api('/api/admin/domain/check', {code: CUR.code, host});
  CUR = await api('/api/admin/hotel', {code: CUR.code});
  tabDomains();
  $('#dns').innerHTML = dnsTable(j);
});
const removeDomain = run(async host => {
  if(!confirm('Remove ' + host + '? Setu will no longer open from that address.')) return;
  await api('/api/admin/domain/remove', {code: CUR.code, host});
  CUR = await api('/api/admin/hotel', {code: CUR.code});
  tabDomains();
});

function tabSupport(){
  $('#tab').innerHTML = `<p>Support Access gives you <b>read-only</b> access to the hotel Setu (nothing is saved). The link expires automatically, and the hotel can see in Settings when support viewed it.</p>
    <div class="grid"><div><label>Duration</label><select id="s_min"><option value="30">30 minutes</option><option value="60" selected>1 hour</option><option value="120">2 hours</option></select></div>
      <div style="grid-column:span 2"><label>Reason (visible to the hotel)</label><input id="s_why" maxlength="120" placeholder="e.g. checking a GST report issue" style="width:100%"></div></div>
    <div class="row" style="margin-top:10px"><button onclick="supportOpen()">Create Support Link</button></div><div id="s_out"></div>
    <h3>Previous Support Access</h3>
    ${(CUR.supportLog || []).map(x => `<div>${dt(x.at)} · ${x.minutes} min · ${esc(x.reason || '')}</div>`).join('') || '<p class="muted">Never</p>'}
    <h3>Lost keys</h3>
    <p class="muted">New Counter PC Sync Key: the old key stops working; enter the new one on the counter PC (Settings → Setu Cloud Sync). Owner password: works on the phone app at once and on the counter PC after its next sync.</p>
    <div class="row"><input id="k_set" placeholder="Current Sync Key (40 characters)" maxlength="40" style="min-width:300px"><button class="g" onclick="setSyncKey()">Record This Key</button></div>
    <div class="row" style="margin-top:8px"><button onclick="newSyncKey()">New Counter PC Sync Key</button>
      <input id="o_pw" placeholder="New owner password (6+ characters)" maxlength="40"><button onclick="ownerPw()">Reset Owner Password</button></div>
    <div id="k_out"></div>`;
}
const newSyncKey = run(async () => {
  if(!confirm('Create a new Sync Key? The counter PC must be updated with it.')) return;
  const j = await api('/api/admin/hotel', {code: CUR.code, update: {newSyncKey: true}});
  $('#k_out').innerHTML = `<p>Hotel Code: <b>${esc(CUR.code)}</b><br>New Sync Key (shown only now): <b style="font-family:monospace">${esc(j.syncKey || '')}</b></p>`;
});
const setSyncKey = run(async () => {
  const k = $('#k_set').value.trim();
  if(!k) return;
  CUR = await api('/api/admin/hotel', {code: CUR.code, update: {setSyncKey: k}});
  toast('Sync Key recorded');
  TAB = 'overview'; drawHotel();
});
const ownerPw2 = run(async () => {
  const pw = $('#o_pw2').value.trim();
  if(!pw) return;
  if(!confirm('Set this as the new owner password for ' + CUR.name + '?')) return;
  CUR = await api('/api/admin/hotel', {code: CUR.code, update: {ownerPassword: pw}});
  toast('Owner password set — tell the owner: ' + pw);
  drawHotel();
});
const ownerPw = run(async () => {
  const pw = $('#o_pw').value.trim();
  await api('/api/admin/hotel', {code: CUR.code, update: {ownerPassword: pw}});
  $('#k_out').innerHTML = '<p>Owner password updated.</p>';
  $('#o_pw').value = '';
});
const supportOpen = run(async () => {
  if(!$('#s_why').value.trim()) return alert('Please enter a reason (visible to the hotel)');
  const j = await api('/api/admin/support', {code: CUR.code, minutes: +$('#s_min').value, reason: $('#s_why').value});
  $('#s_out').innerHTML = `<p class="ok">Link created (${j.minutes} min): <a href="${esc(j.url)}" target="_blank" rel="noopener">Open the hotel Setu</a></p>`;
});

const tabLog = run(async () => { $('#tab').innerHTML = '<div style="overflow-x:auto">' + await drawAudit(CUR.code) + '</div>'; });

// ---------------- start ----------------
function logout(){ try{ sessionStorage.removeItem('setu_admin'); localStorage.removeItem('setu_admin'); }catch(e){} location.reload(); }
async function openPanel(){
  try{
    META = await api('/api/admin/meta');
    try{ sessionStorage.setItem('setu_admin', KEY); if($('#remember') && $('#remember').checked) localStorage.setItem('setu_admin', KEY); }catch(e){}
    $('#login').hidden = true;
    $('#app').hidden = false;
    show('hotels');   // like Library ERP: open on the list, most urgent first
  }catch(e){
    // A remembered key that no longer works must not keep trying (it would lock this device)
    if(/Invalid Admin Key/.test(e.message)){ try{ sessionStorage.removeItem('setu_admin'); localStorage.removeItem('setu_admin'); }catch(x){} KEY = ''; }
    $('#lerr').textContent = e.message;
  }
}
$('#lf').onsubmit = e => { e.preventDefault(); KEY = $('#key').value.trim(); openPanel(); };
$('#drawer').onclick = e => { if(e.target.id === 'drawer') closeHotel(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape' && CUR) closeHotel(); });
if(KEY) openPanel();
</script>
</body>
</html>
